<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">

<meta name="viewport"
      content="width=device-width, initial-scale=1.0">

<title>STG Fee WhatsApp</title>

<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="icon.png">

<meta name="theme-color" content="#176d73">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="STG Fees">

<style>

* {
    box-sizing: border-box;
}

body {
    margin: 0;
    font-family: Arial, sans-serif;
    background: #f2f7f7;
    color: #173b3d;
}

header {
    background: linear-gradient(135deg, #176d73, #239b91);
    color: white;
    text-align: center;
    padding: 20px 15px;
}

header h1 {
    margin: 0;
    font-size: 21px;
}

header p {
    margin: 5px 0 0;
    font-size: 13px;
}

.container {
    max-width: 650px;
    margin: auto;
    padding: 15px;
    padding-bottom: 100px;
}

.card {
    background: white;
    padding: 18px;
    border-radius: 16px;
    margin-bottom: 15px;
    box-shadow: 0 3px 12px rgba(0,0,0,.07);
}

.card h2 {
    color: #176d73;
    margin-top: 0;
    font-size: 19px;
}

label {
    display: block;
    margin-top: 13px;
    margin-bottom: 6px;
    font-size: 13px;
    font-weight: bold;
}

input,
select {
    width: 100%;
    padding: 13px;
    border: 1px solid #ccdada;
    border-radius: 10px;
    font-size: 15px;
    background: white;
}

input:focus,
select:focus {
    outline: none;
    border-color: #176d73;
}

button {
    border: none;
    border-radius: 10px;
    padding: 13px;
    font-size: 14px;
    font-weight: bold;
    cursor: pointer;
}

.full {
    width: 100%;
    margin-top: 14px;
}

.primary {
    background: #176d73;
    color: white;
}

.whatsapp {
    background: #25D366;
    color: white;
}

.gold {
    background: #e4ad3e;
    color: white;
}

.danger {
    background: #d9534f;
    color: white;
}

.light {
    background: #e8f2f2;
    color: #176d73;
}

.hidden {
    display: none !important;
}

/* HOME */

.date-box {
    text-align: center;
}

.date-number {
    font-size: 40px;
    font-weight: bold;
    color: #176d73;
}

.date-text {
    color: #777;
    margin-top: 4px;
}

.status {
    background: #fff8df;
    color: #715c19;
    padding: 14px;
    border-radius: 10px;
    line-height: 1.5;
    font-size: 14px;
}

/* ADD STUDENT */

.add-title {
    display: flex;
    justify-content: space-between;
    align-items: center;
}

.add-title h2 {
    margin-bottom: 0;
}

.cancel-btn {
    padding: 8px 12px;
}

/* STUDENT */

.student {
    border: 1px solid #d8e5e5;
    border-radius: 12px;
    padding: 14px;
    margin-top: 10px;
}

.student-name {
    color: #176d73;
    font-size: 17px;
    font-weight: bold;
}

.student-details {
    color: #666;
    font-size: 13px;
    line-height: 1.6;
    margin-top: 6px;
}

.student-buttons {
    display: flex;
    gap: 8px;
    margin-top: 12px;
}

.student-buttons button {
    flex: 1;
}

.message {
    background: #f3f7f7;
    border-radius: 10px;
    padding: 14px;
    margin-top: 13px;
    white-space: pre-line;
    line-height: 1.5;
    font-size: 14px;
}

.search {
    margin-bottom: 10px;
}

/* NAV */

nav {
    position: fixed;
    bottom: 0;
    left: 0;
    right: 0;

    background: white;

    display: flex;

    box-shadow: 0 -3px 15px rgba(0,0,0,.12);

    z-index: 1000;
}

nav button {
    flex: 1;
    background: transparent;
    color: #176d73;
    border-radius: 0;
    font-size: 11px;
    padding: 9px 3px;
}

nav button.active {
    background: #e8f2f2;
}

.empty {
    text-align: center;
    color: #777;
    padding: 20px;
}

footer {
    text-align: center;
    font-size: 11px;
    color: #777;
    padding: 20px;
}

</style>
</head>

<body>


<header>

    <h1>ST. THERESA’S GEMS</h1>

    <p>
        Monthly Fee WhatsApp
    </p>

</header>


<div class="container">


<!-- ================================================= -->
<!-- HOME -->
<!-- ================================================= -->

<section id="home">

    <div class="card date-box">

        <div
            id="dayNumber"
            class="date-number">
            --
        </div>

        <div
            id="dateText"
            class="date-text">
            --
        </div>

    </div>


    <div class="card">

        <h2>
            📅 Monthly Fee Status
        </h2>

        <div
            id="feeStatus"
            class="status">

            Loading...

        </div>

    </div>


    <div class="card">

        <h2>
            👧 Students
        </h2>

        <div
            id="homeStudentCount"
            class="status">

            Loading...

        </div>

    </div>

</section>



<!-- ================================================= -->
<!-- STUDENTS -->
<!-- ================================================= -->

<section
    id="students"
    class="hidden">


    <!-- ADD STUDENT -->

    <div class="card">

        <div class="add-title">

            <h2 id="formTitle">
                ➕ Add Student
            </h2>

            <button
                id="cancelButton"
                class="light cancel-btn hidden"
                onclick="cancelEdit()">

                Cancel

            </button>

        </div>


        <label>
            Student ID
        </label>

        <input
            id="studentId"
            type="text"
            placeholder="STG-STU-0001"
        >


        <label>
            Child Name
        </label>

        <input
            id="childName"
            type="text"
            placeholder="Enter child's full name"
        >


        <label>
            Class
        </label>

        <select id="className">

            <option value="">
                Select Class
            </option>

            <option>
                Play Group
            </option>

            <option>
                Nursery
            </option>

            <option>
                LKG
            </option>

            <option>
                UKG
            </option>

        </select>


        <label>
            Parent / Guardian Name
        </label>

        <input
            id="parentName"
            type="text"
            placeholder="Enter parent name"
        >


        <label>
            WhatsApp Number
        </label>

        <input
            id="phone"
            type="tel"
            placeholder="94771234567"
        >


        <label>
            Monthly Fee
        </label>

        <input
            id="fee"
            type="number"
            placeholder="5000"
        >


        <button
            id="saveButton"
            class="primary full"
            onclick="saveStudent()">

            💾 SAVE STUDENT

        </button>

    </div>



    <!-- SAVED STUDENTS -->

    <div class="card">

        <h2>
            👧 Saved Students
        </h2>


        <input
            id="search"
            class="search"
            type="search"
            placeholder="🔎 Search student..."
            oninput="showStudents()"
        >


        <div id="studentList">
        </div>

    </div>

</section>



<!-- ================================================= -->
<!-- PAYMENT -->
<!-- ================================================= -->

<section
    id="payment"
    class="hidden">

    <div class="card">

        <h2>
            💳 Payment Successful
        </h2>


        <label>
            Select Student
        </label>

        <select
            id="paymentStudent"
            onchange="paymentStudentChanged()">

            <option value="">
                Select Student
            </option>

        </select>


        <label>
            Month
        </label>

        <select id="paymentMonth">

        </select>


        <label>
            Amount
        </label>

        <input
            id="paymentAmount"
            type="number"
            placeholder="Amount"
        >


        <div
            id="paymentMessage"
            class="message">

            Select a student.

        </div>


        <button
            class="whatsapp full"
            onclick="sendPayment()">

            💬 SEND PAYMENT MESSAGE

        </button>

    </div>

</section>



<!-- ================================================= -->
<!-- REMINDER -->
<!-- ================================================= -->

<section
    id="reminder"
    class="hidden">

    <div class="card">

        <h2>
            📅 Monthly Fee Reminder
        </h2>


        <div
            id="reminderStatus"
            class="status">

        </div>


        <label>
            Select Parent
        </label>

        <select id="reminderStudent">

            <option value="">
                Select Parent
            </option>

        </select>


        <div
            id="reminderMessage"
            class="message">

        </div>


        <button
            class="whatsapp full"
            onclick="sendReminder()">

            💬 SEND REMINDER

        </button>

        <p
            style="
            font-size:12px;
            color:#777;
            margin-top:10px;
            ">

            The child's name is not included
            in the reminder.

        </p>

    </div>

</section>


</div>


<footer>

ST. THERESA’S GEMS INTERNATIONAL PRESCHOOL

</footer>



<!-- ================================================= -->
<!-- NAVIGATION -->
<!-- ================================================= -->

<nav>

    <button
        id="navHome"
        class="active"
        onclick="openPage('home',this)">

        🏠
        <br>
        Home

    </button>


    <button
        id="navStudents"
        onclick="openPage('students',this)">

        👧
        <br>
        Students

    </button>


    <button
        id="navPayment"
        onclick="openPage('payment',this)">

        💳
        <br>
        Payment

    </button>


    <button
        id="navReminder"
        onclick="openPage('reminder',this)">

        📅
        <br>
        Reminder

    </button>

</nav>



<script>

/* =====================================================
   STORAGE
===================================================== */

const STORAGE_KEY =
    "STG_FEE_STUDENTS";


let students =
    JSON.parse(
        localStorage.getItem(
            STORAGE_KEY
        )
    ) || [];


let editingIndex = -1;


/* =====================================================
   MONTHS
===================================================== */

const months = [

    "January",
    "February",
    "March",
    "April",
    "May",
    "June",
    "July",
    "August",
    "September",
    "October",
    "November",
    "December"

];


/* =====================================================
   SAVE
===================================================== */

function saveData() {

    localStorage.setItem(
        STORAGE_KEY,
        JSON.stringify(students)
    );

}


/* =====================================================
   PHONE NUMBER
===================================================== */

function cleanPhone(phone) {

    phone =
        phone.replace(
            /\D/g,
            ""
        );


    if (
        phone.startsWith("0")
    ) {

        phone =
            "94" +
            phone.substring(1);

    }


    if (
        phone.startsWith("94")
    ) {

        return phone;

    }


    return phone;

}


/* =====================================================
   ADD STUDENT
===================================================== */

function saveStudent() {

    const id =
        document.getElementById(
            "studentId"
        ).value.trim();


    const name =
        document.getElementById(
            "childName"
        ).value.trim();


    const className =
        document.getElementById(
            "className"
        ).value;


    const parent =
        document.getElementById(
            "parentName"
        ).value.trim();


    const phone =
        cleanPhone(
            document.getElementById(
                "phone"
            ).value
        );


    const fee =
        document.getElementById(
            "fee"
        ).value;


    if (!id) {

        alert(
            "Please enter the Student ID."
        );

        return;

    }


    if (!name) {

        alert(
            "Please enter the child's name."
        );

        return;

    }


    if (!className) {

        alert(
            "Please select the class."
        );

        return;

    }


    if (!parent) {

        alert(
            "Please enter the parent/guardian name."
        );

        return;

    }


    if (!phone) {

        alert(
            "Please enter the WhatsApp number."
        );

        return;

    }


    if (!fee) {

        alert(
            "Please enter the monthly fee."
        );

        return;

    }


    const student = {

        id: id,

        name: name,

        className: className,

        parent: parent,

        phone: phone,

        fee: Number(fee)

    };


    if (
        editingIndex === -1
    ) {

        students.push(
            student
        );

        alert(
            "Student added successfully!"
        );

    } else {

        students[
            editingIndex
        ] = student;

        alert(
            "Student updated successfully!"
        );

    }


    saveData();

    clearForm();

    showStudents();

    updateSelects();

    updateHome();

}


/* =====================================================
   CLEAR FORM
===================================================== */

function clearForm() {

    document.getElementById(
        "studentId"
    ).value = "";

    document.getElementById(
        "childName"
    ).value = "";

    document.getElementById(
        "className"
    ).value = "";

    document.getElementById(
        "parentName"
    ).value = "";

    document.getElementById(
        "phone"
    ).value = "";

    document.getElementById(
        "fee"
    ).value = "";


    editingIndex = -1;


    document.getElementById(
        "formTitle"
    ).textContent =
        "➕ Add Student";


    document.getElementById(
        "saveButton"
    ).textContent =
        "💾 SAVE STUDENT";


    document.getElementById(
        "cancelButton"
    ).classList.add(
        "hidden"
    );

}


/* =====================================================
   EDIT
===================================================== */

function editStudent(index) {

    const student =
        students[index];


    document.getElementById(
        "studentId"
    ).value =
        student.id;


    document.getElementById(
        "childName"
    ).value =
        student.name;


    document.getElementById(
        "className"
    ).value =
        student.className;


    document.getElementById(
        "parentName"
    ).value =
        student.parent;


    document.getElementById(
        "phone"
    ).value =
        student.phone;


    document.getElementById(
        "fee"
    ).value =
        student.fee;


    editingIndex =
        index;


    document.getElementById(
        "formTitle"
    ).textContent =
        "✏️ Edit Student";


    document.getElementById(
        "saveButton"
    ).textContent =
        "💾 UPDATE STUDENT";


    document.getElementById(
        "cancelButton"
    ).classList.remove(
        "hidden"
    );


    window.scrollTo({
        top: 0,
        behavior: "smooth"
    });

}


/* =====================================================
   CANCEL
===================================================== */

function cancelEdit() {

    clearForm();

}


/* =====================================================
   DELETE
===================================================== */

function deleteStudent(index) {

    const student =
        students[index];


    if (
        !confirm(
            "Delete " +
            student.name +
            "?"
        )
    ) {

        return;

    }


    students.splice(
        index,
        1
    );


    saveData();

    showStudents();

    updateSelects();

    updateHome();

}


/* =====================================================
   DISPLAY STUDENTS
===================================================== */

function showStudents() {

    const list =
        document.getElementById(
            "studentList"
        );


    const search =
        document.getElementById(
            "search"
        ).value
        .toLowerCase()
        .trim();


    list.innerHTML = "";


    const filtered =
        students.filter(
            student =>

                student.name
                    .toLowerCase()
                    .includes(search)

                ||

                student.id
                    .toLowerCase()
                    .includes(search)

                ||

                student.className
                    .toLowerCase()
                    .includes(search)

                ||

                student.parent
                    .toLowerCase()
                    .includes(search)
        );


    if (
        filtered.length === 0
    ) {

        list.innerHTML =

            `<div class="empty">
                No students found.
            </div>`;

        return;

    }


    filtered.forEach(
        student => {

            const index =
                students.indexOf(
                    student
                );


            const div =
                document.createElement(
                    "div"
                );


            div.className =
                "student";


            div.innerHTML = `

                <div class="student-name">
                    ${escapeHTML(student.name)}
                </div>

                <div class="student-details">

                    🆔 Student ID:
                    ${escapeHTML(student.id)}

                    <br>

                    🏫 Class:
                    ${escapeHTML(student.className)}

                    <br>

                    👨‍👩‍👧 Parent:
                    ${escapeHTML(student.parent)}

                    <br>

                    📱 WhatsApp:
                    ${escapeHTML(student.phone)}

                    <br>

                    💰 Monthly Fee:
                    ${student.fee}

                </div>


                <div class="student-buttons">

                    <button
                        class="light"
                        onclick="editStudent(${index})">

                        ✏️ Edit

                    </button>


                    <button
                        class="danger"
                        onclick="deleteStudent(${index})">

                        🗑️ Delete

                    </button>

                </div>

            `;


            list.appendChild(
                div
            );

        }
    );

}


/* =====================================================
   HTML SAFETY
===================================================== */

function escapeHTML(text) {

    return String(text)
        .replace(
            /&/g,
            "&amp;"
        )
        .replace(
            /</g,
            "&lt;"
        )
        .replace(
            />/g,
            "&gt;"
        )
        .replace(
            /"/g,
            "&quot;"
        )
        .replace(
            /'/g,
            "&#039;"
        );

}


/* =====================================================
   UPDATE SELECT BOXES
===================================================== */

function updateSelects() {

    const payment =
        document.getElementById(
            "paymentStudent"
        );


    const reminder =
        document.getElementById(
            "reminderStudent"
        );


    payment.innerHTML =
        `<option value="">
            Select Student
        </option>`;


    reminder.innerHTML =
        `<option value="">
            Select Parent
        </option>`;


    students.forEach(
        (student,index) => {

            const option =
                document.createElement(
                    "option"
                );

            option.value =
                index;

            option.textContent =
                student.name +
                " — " +
                student.className;

            payment.appendChild(
                option
            );


            const option2 =
                document.createElement(
                    "option"
                );

            option2.value =
                index;

            option2.textContent =
                student.name +
                " — " +
                student.parent;

            reminder.appendChild(
                option2
            );

        }
    );

}


/* =====================================================
   PAYMENT MONTHS
===================================================== */

function setupMonths() {

    const select =
        document.getElementById(
            "paymentMonth"
        );


    const now =
        new Date();


    months.forEach(
        (month,index) => {

            const option =
                document.createElement(
                    "option"
                );

            option.value =
                month;

            option.textContent =
                month;


            if (
                index ===
                now.getMonth()
            ) {

                option.selected =
                    true;

            }


            select.appendChild(
                option
            );

        }
    );

}


/* =====================================================
   PAYMENT STUDENT
===================================================== */

function paymentStudentChanged() {

    const index =
        document.getElementById(
            "paymentStudent"
        ).value;


    if (
        index === ""
    ) {

        document.getElementById(
            "paymentAmount"
        ).value = "";

        document.getElementById(
            "paymentMessage"
        ).textContent =
            "Select a student.";

        return;

    }


    const student =
        students[index];


    document.getElementById(
        "paymentAmount"
    ).value =
        student.fee;


    updatePaymentMessage();

}


/* =====================================================
   PAYMENT MESSAGE
===================================================== */

document.getElementById(
    "paymentMonth"
).addEventListener(
    "change",
    updatePaymentMessage
);


document.getElementById(
    "paymentAmount"
).addEventListener(
    "input",
    updatePaymentMessage
);


function updatePaymentMessage() {

    const index =
        document.getElementById(
            "paymentStudent"
        ).value;


    if (
        index === ""
    ) {

        return;

    }


    const student =
        students[index];


    const month =
        document.getElementById(
            "paymentMonth"
        ).value;


    const amount =
        document.getElementById(
            "paymentAmount"
        ).value;


    document.getElementById(
        "paymentMessage"
    ).textContent =

`Payment received successfully.

Child: ${student.name}
Month: ${month}
Amount: ${amount}

Thank you.`;

}


/* =====================================================
   SEND PAYMENT
===================================================== */

function sendPayment() {

    const index =
        document.getElementById(
            "paymentStudent"
        ).value;


    if (
        index === ""
    ) {

        alert(
            "Please select a student."
        );

        return;

    }


    const student =
        students[index];


    const month =
        document.getElementById(
            "paymentMonth"
        ).value;


    const amount =
        document.getElementById(
            "paymentAmount"
        ).value;


    const message =

`Payment received successfully.

Child: ${student.name}
Month: ${month}
Amount: ${amount}

Thank you.`;


    const url =
        "https://wa.me/" +
        student.phone +
        "?text=" +
        encodeURIComponent(
            message
        );


    window.open(
        url,
        "_blank"
    );

}


/* =====================================================
   REMINDER MONTH
===================================================== */

function getReminderMonth() {

    const now =
        new Date();


    let month =
        now.getMonth();


    if (
        now.getDate() > 20
    ) {

        month++;

        if (
            month > 11
        ) {

            month = 0;

        }

    }


    return months[month];

}


/* =====================================================
   REMINDER
===================================================== */

function updateReminder() {

    const now =
        new Date();


    const month =
        getReminderMonth();


    if (
        now.getDate() > 20
    ) {

        document.getElementById(
            "reminderStatus"
        ).textContent =

            "The 20th has passed. " +
            "The reminder is active for " +
            month +
            ".";

    } else {

        document.getElementById(
            "reminderStatus"
        ).textContent =

            "The reminder will become " +
            "active after the 20th.";

    }


    /*
       IMPORTANT:
       No child's name here.
    */

    document.getElementById(
        "reminderMessage"
    ).textContent =

`Dear Parent/Guardian,

This is a reminder to kindly pay the monthly school fee for ${month}.

Thank you.`;

}


/* =====================================================
   SEND REMINDER
===================================================== */

function sendReminder() {

    const index =
        document.getElementById(
            "reminderStudent"
        ).value;


    if (
        index === ""
    ) {

        alert(
            "Please select a parent."
        );

        return;

    }


    const student =
        students[index];


    const month =
        getReminderMonth();


    /*
       CHILD NAME IS NOT INCLUDED.
    */

    const message =

`Dear Parent/Guardian,

This is a reminder to kindly pay the monthly school fee for ${month}.

Thank you.`;


    const url =
        "https://wa.me/" +
        student.phone +
        "?text=" +
        encodeURIComponent(
            message
        );


    window.open(
        url,
        "_blank"
    );

}


/* =====================================================
   HOME
===================================================== */

function updateHome() {

    const now =
        new Date();


    document.getElementById(
        "dayNumber"
    ).textContent =
        now.getDate();


    document.getElementById(
        "dateText"
    ).textContent =
        now.toLocaleDateString(
            "en-US",
            {
                weekday: "long",
                month: "long",
                year: "numeric"
            }
        );


    document.getElementById(
        "homeStudentCount"
    ).textContent =

        students.length === 1

        ?

        "1 student is saved."

        :

        students.length +
        " students are saved.";


    if (
        now.getDate() > 20
    ) {

        document.getElementById(
            "feeStatus"
        ).textContent =

            "The 20th has passed. " +
            "Monthly fee reminders are now active.";

    } else {

        document.getElementById(
            "feeStatus"
        ).textContent =

            "Monthly fee reminders become active after the 20th.";

    }

}


/* =====================================================
   PAGE SWITCHING
===================================================== */

function openPage(
    page,
    button
) {

    document.getElementById(
        "home"
    ).classList.add(
        "hidden"
    );

    document.getElementById(
        "students"
    ).classList.add(
        "hidden"
    );

    document.getElementById(
        "payment"
    ).classList.add(
        "hidden"
    );

    document.getElementById(
        "reminder"
    ).classList.add(
        "hidden"
    );


    document.getElementById(
        page
    ).classList.remove(
        "hidden"
    );


    document.querySelectorAll(
        "nav button"
    ).forEach(
        btn => {

            btn.classList.remove(
                "active"
            );

        }
    );


    button.classList.add(
        "active"
    );


    if (
        page === "students"
    ) {

        showStudents();

    }


    if (
        page === "reminder"
    ) {

        updateReminder();

    }

}


/* =====================================================
   SERVICE WORKER
===================================================== */

if (
    "serviceWorker"
    in navigator
) {

    window.addEventListener(
        "load",
        function() {

            navigator.serviceWorker
                .register(
                    "sw.js"
                )
                .catch(
                    function(error) {

                        console.log(
                            "Service worker error:",
                            error
                        );

                    }
                );

        }
    );

}


/* =====================================================
   START
===================================================== */

setupMonths();

updateSelects();

showStudents();

updateHome();

updateReminder();

</script>
